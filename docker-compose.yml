services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: reaper
      POSTGRES_PASSWORD: reaper
      POSTGRES_DB: detachment_reaper
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reaper -d detachment_reaper"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - ./server/src:/app/src
      - ./prisma:/app/prisma
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://reaper:reaper@db:5432/detachment_reaper
      BETTER_AUTH_SECRET: changeme-in-production
      BETTER_AUTH_URL: http://localhost:3001
      CLIENT_URL: http://localhost:3000
      PORT: "3001"
    env_file:
      - .env

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src
    depends_on:
      - api
    environment:
      VITE_API_URL: http://localhost:3001
    env_file:
      - .env

volumes:
  pgdata:
