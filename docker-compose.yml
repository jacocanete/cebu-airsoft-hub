services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: reaper
      POSTGRES_PASSWORD: reaper
      POSTGRES_DB: detachment_reaper
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reaper -d detachment_reaper"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/detachment-reaper &&
      mc anonymous set download local/detachment-reaper &&
      exit 0
      "

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - ./server/src:/app/src
      - ./prisma:/app/prisma
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://reaper:reaper@db:5432/detachment_reaper
      BETTER_AUTH_SECRET: changeme-in-production
      BETTER_AUTH_URL: http://localhost:3001
      CLIENT_URL: http://localhost:3000
      PORT: "3001"
      R2_ENDPOINT: http://minio:9000
      R2_PRESIGN_URL: http://localhost:9000
      R2_ACCESS_KEY_ID: minioadmin
      R2_SECRET_ACCESS_KEY: minioadmin
      R2_BUCKET_NAME: detachment-reaper
      R2_PUBLIC_URL: http://localhost:9000/detachment-reaper
    env_file:
      - .env

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src
    depends_on:
      - api
    environment:
      VITE_API_URL: http://localhost:3001
    env_file:
      - .env

volumes:
  pgdata:
  minio_data:
